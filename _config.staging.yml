# Staging-only overrides. Loaded AFTER _config.yml (e.g.
# `jekyll build --config _config.yml,_config.staging.yml`).
# These flags drive the preview-only behavior required by the
# staging/production build split (FR-4, FR-5, FR-20..FR-24, FR-32, FR-33).

# Master staging signal. Conditional Liquid in includes, robots.txt,
# sitemap.xml and feed/flux templates gates on this flag.
staging: true

# Preview host that serves PR preview artifacts. Used by metadata.html to
# build baseurl-aware canonical, alternate and language-toggle URLs so
# reviewers never leave the preview host (FR-24).
staging_host: "https://test.canada.ca"

# Staging analytics (FR-21). Only the Adobe tracking id differs from
# production; gcaaterms is kept identical so the only analytics delta is
# the tracking id, which the config delta gate normalizes.
analytics:
  provider:
    adobe:
      tracking_id: "be5dfd287373/0127575cd23a/launch-913b1beddf7a-staging"
      service: "ESDC_TEST-TEST_EDSC"
      gcaaterms: "ESDC-EDSC_CanadacaBlog-BlogueCanadaca"
